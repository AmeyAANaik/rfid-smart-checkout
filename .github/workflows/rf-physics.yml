name: openEMS 866 MHz antenna physics

on:
  workflow_dispatch:
  push:
    paths:
      - "rf_physics/**"
      - ".github/workflows/rf-physics.yml"

permissions:
  contents: read

jobs:
  fdtd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install openEMS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libhdf5-dev libvtk9-dev libboost-all-dev libcgal-dev libtinyxml-dev python3-pip python3-venv python3-numpy python3-matplotlib python3-h5py
      - name: Build openEMS and Python bindings from upstream
        run: |
          git clone --depth 1 https://github.com/thliebig/openEMS-Project.git /tmp/openEMS-Project
          cd /tmp/openEMS-Project
          ./update_openEMS.sh --python
      - name: Find solver Python environment
        run: |
          find /tmp/openEMS-Project -type d -name site-packages | head -10
          python3 -c "from openEMS import openEMS; from CSXCAD import ContinuousStructure; print('openEMS ready')" || (find /tmp/openEMS-Project -type f -name 'openEMS*.so'; exit 1)
      - name: Execute 866 MHz FDTD simulation
        run: |
          mkdir -p results/patch
          python3 rf_physics/patch_866.py --output results/patch --plot
          test -s results/patch/s11.csv
          test -s results/patch/farfield.npz
      - name: Upload physics outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openems-866mhz-results
          path: results/patch/
          if-no-files-found: warn
